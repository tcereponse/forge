<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700&display=swap');
        
        body {
            width: 320px;
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .cockpit {
            background: linear-gradient(145deg, rgba(20,20,35,0.8), rgba(10,10,20,0.9));
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, #00f2ff, #0060ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .version {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }

        .phase-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }

        .phase-led {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }

        .phase-led.active {
            background: #00f2ff;
            box-shadow: 0 0 10px #00f2ff;
        }

        .phase-label {
            font-size: 8px;
            margin-top: 4px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }

        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 12px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(0,242,255,0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #00f2ff, #0060ff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,242,255,0.4);
        }

        .footer {
            margin-top: 15px;
            font-size: 9px;
            color: rgba(0,242,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="cockpit">
        <h1>Global KIROV3</h1>
        <div class="version">Elite Forge Industrial v13.0</div>
        
        <div class="phase-grid">
            <div class="phase-container">
                <div id="led-1" class="phase-led"></div>
                <div class="phase-label">P1</div>
            </div>
            <div class="phase-container">
                <div id="led-2" class="phase-led"></div>
                <div class="phase-label">P2</div>
            </div>
            <div class="phase-container">
                <div id="led-3" class="phase-led"></div>
                <div class="phase-label">P3</div>
            </div>
            <div class="phase-container">
                <div id="led-4" class="phase-led"></div>
                <div class="phase-label">P4</div>
            </div>
            <div class="phase-container">
                <div id="led-5" class="phase-led"></div>
                <div class="phase-label">P5</div>
            </div>
            <div class="phase-container">
                <div id="led-6" class="phase-led"></div>
                <div class="phase-label">P6</div>
            </div>
        </div>

        <div class="status-box" id="status-text">
            Initialisation du Bridge...
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <button id="oneshot-btn" style="flex: 1; font-size: 10px; padding: 10px 5px;">One-Shot</button>
            <button id="p6-btn" style="flex: 1; font-size: 10px; padding: 10px 5px; background: linear-gradient(135deg, #ff00ff, #8a2be2);">P6 (Flat Arch)</button>
        </div>

        <div class="footer pulse">Grade Diamond Active</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
