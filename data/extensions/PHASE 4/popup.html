<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; background: #0a0a0a; color: #00f2ff; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a1a1a; padding-bottom: 10px; }
    .status-badge { background: #00f2ff; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .log-container { background: #000; height: 150px; overflow-y: auto; font-size: 11px; padding: 10px; margin-top: 10px; border: 1px solid #1a1a1a; color: #fff; }
    .btn { width: 100%; background: #1a1a1a; color: #00f2ff; border: 1px solid #00f2ff; padding: 8px; margin-top: 10px; cursor: pointer; font-weight: bold; border-radius: 4px; }
    .btn:hover { background: #00f2ff; color: #000; }
  </style>
</head>
<body>
  <div class="header">
    <span>PHASE 4 — FORGE APK</span>
    <span class="status-badge">AUTO-FORGE ON</span>
  </div>
  <div id="logs" class="log-container">
    En attente de logs...
  </div>
  <button id="btn-rebuild" class="btn">REBUILD MANUEL</button>
  <script src="popup.js"></script>
</body>
</html>
