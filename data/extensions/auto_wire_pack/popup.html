<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 260px; min-height: 180px;
    background: #0d1117; color: #f1f5f9;
    font-family: 'Segoe UI', monospace; font-size: 12px;
    padding: 16px;
  }
  .header {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(56,189,248,0.2);
    padding-bottom: 12px; margin-bottom: 12px;
  }
  .title { font-weight: 900; color: #38bdf8; letter-spacing: 1px; font-size: 11px; }
  .subtitle { color: #64748b; font-size: 9px; margin-top: 2px; }
  .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-label { font-size: 10px; color: #94a3b8; }
  .status-val { font-size: 10px; color: #4ade80; font-weight: bold; }
  .btn {
    width: 100%; padding: 8px; border: none; border-radius: 7px;
    cursor: pointer; font-weight: 700; font-size: 10px; margin-top: 6px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: linear-gradient(90deg, #0ea5e9, #2563eb); color: #fff; }
  .btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
  .info { font-size: 9px; color: #475569; margin-top: 10px; text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="title">⚡ AUTO-WIRE ENGINE</div>
    <div class="subtitle">Moteur d'Intégration Universelle v1.0</div>
  </div>
</div>
<div class="status-row">
  <span class="status-label">Statut Bridge</span>
  <div style="display:flex;align-items:center;gap:6px">
    <div class="dot" id="dot"></div>
    <span class="status-val" id="bridge-status">---</span>
  </div>
</div>
<div class="status-row">
  <span class="status-label">Projet actif</span>
  <span class="status-val" id="project-id">---</span>
</div>
<button class="btn btn-primary" id="btn-poll">🔄 Actualiser</button>
<button class="btn btn-danger" id="btn-clear">🗑 Effacer le prompt</button>
<div class="info">Connecté au Bridge Sovereign<br>Port 5005 · Polled every 2s</div>
<script src="popup.js"></script>
</body>
</html>
