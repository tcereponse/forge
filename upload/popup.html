<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700&display=swap');
        
        body {
            width: 320px;
            margin: 0;
            padding: 20px;
            background: #0a0a12;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .cockpit {
            background: linear-gradient(145deg, rgba(20,20,35,0.8), rgba(10,10,20,0.9));
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, #00f2ff, #0060ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .version {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 20px;
        }

        .status {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed rgba(0,242,255,0.1);
            transition: all 0.3s;
        }

        .status.online { color: #4ade80; border-color: rgba(74, 222, 128, 0.3); }
        .status.offline { color: #f87171; border-color: rgba(248, 113, 113, 0.3); }

        #phase-info {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 20px;
            min-height: 15px;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #00f2ff, #0060ff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,242,255,0.4);
        }

        #check-btn {
            background: rgba(255, 255, 255, 0.1);
        }

        #reset-btn {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
        }
        #reset-btn:hover {
            box-shadow: 0 5px 20px rgba(239, 68, 68, 0.4);
        }

        .footer {
            margin-top: 15px;
            font-size: 9px;
            color: rgba(0,242,255,0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="cockpit">
        <h1>ELITE FORGE — KIROV3</h1>
        <div class="version">Serveur: forge-kohl-kappa.vercel.app</div>
        
        <div id="status" class="status offline">
            Vérification...
        </div>

        <div id="phase-info">
            Chargement de la mission...
        </div>

        <button id="start-btn">🚀 Lancer Mission</button>
        <button id="check-btn">🔄 Actualiser Statut</button>
        <button id="reset-btn">🗑️ Réinitialiser</button>

        <div class="footer">Vercel Edition V14.1 Auto-Healing</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
