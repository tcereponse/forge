<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            background: #02050a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            border: 1px solid #00aaff;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #00aaff;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #00aaff;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff88;
        }
        .ext-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .ext-item {
            background: rgba(0, 170, 255, 0.1);
            border: 1px solid rgba(0, 170, 255, 0.3);
            margin-bottom: 5px;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }
        .category-title {
            font-size: 9px;
            font-weight: 900;
            margin: 15px 0 8px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cat-structure { color: #ffcc00; }
        .cat-integrity { color: #00d2ff; }
        .cat-hygiene { color: #00ff88; }
        
        .empty {
            font-size: 11px;
            color: #666;
            text-align: center;
            padding: 20px;
        }
        .footer {
            margin-top: 15px;
            font-size: 9px;
            color: #444;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">⚡ PHASE 2 — FORGE DU CODE</div>
        <div class="status-dot" id="status"></div>
    </div>
    
    <div style="font-size: 10px; margin-bottom: 10px; color: #aaa;">MODULES ACTIFS :</div>
    <ul class="ext-list" id="active-list">
        <div class="empty">Chargement du spectre...</div>
    </ul>

    <div class="footer">ELITE FORGE SOVEREIGN • STEALTH BRIDGE</div>

    <script src="popup.js"></script>
</body>
</html>
