<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            background: #02050a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            border: 1px solid #a78bfa;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #a78bfa;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
            color: #a78bfa;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #a78bfa;
            border-radius: 50%;
            box-shadow: 0 0 8px #a78bfa;
        }
        .info-box {
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-size: 11px;
            line-height: 1.5;
        }
        .item { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .dot { color: #a78bfa; }
        .footer {
            margin-top: 15px;
            font-size: 9px;
            color: #444;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🛡️ PHASE 3 — HARDEN</div>
        <div class="status-dot" id="status"></div>
    </div>
    
    <div class="info-box">
        <div class="item"><span class="dot">●</span> Corrections Mineures</div>
        <div class="item"><span class="dot">●</span> Setup Vitest & Tests API</div>
        <div class="item"><span class="dot">●</span> Setup Playwright & E2E</div>
        <div class="item"><span class="dot">●</span> Docker & Orchestration</div>
        <div class="item"><span class="dot">●</span> Scripts de Lancement</div>
    </div>

    <div class="footer">ELITE FORGE SOVEREIGN • STEALTH BRIDGE</div>
</body>
</html>
